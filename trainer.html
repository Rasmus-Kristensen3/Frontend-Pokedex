
<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon Trainers</title>

    <link rel="stylesheet" href="trainer.css">

</head>

<body>

<!-- Navigation -->
<header>
    <nav>
        <h1>Pokédex</h1>

        <a href="forside.html">Forside</a>
        <a href="pokemon.html">Pokémon</a>
        <a href="trainer.html">Trainers</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>

    <!-- Overskrift -->
    <section class="pageTitle">
        <h1>Trainers</h1>

        <p>
            Vælg en trainer, se deres Pokemon,
            eller opret en ny trainer
        </p>
    </section>

    <!-- Venstre og højre side -->
    <div class="trainerLayout">

        <!-- VENSTRE SIDE -->
        <div class="leftSide">

            <!-- Liste med alle trainers -->
            <section id="allTrainersSection">

                <h2>Alle Trainers</h2>

                <ul id="allTrainersList"></ul>

            </section>

            <!-- Opret ny trainer -->
            <section id="createTrainerSection">

                <button type="button" id="createTrainer">
                    + Opret ny trainer
                </button>

                <form id="createTrainerForm" hidden>

                    <h2>Opret ny trainer</h2>

                    <input
                            type="text"
                            id="new_trainer_name"
                            name="trainer_name"
                            placeholder="Trainer navn"
                            required
                    >

                    <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Alder"
                            required
                    >

                    <input
                            type="text"
                            id="hometown"
                            name="hometown"
                            placeholder="Hjemby"
                            required
                    >

                    <button type="submit">
                        Opret trainer
                    </button>

                </form>

            </section>

        </div>

        <!-- HØJRE SIDE -->
        <div class="rightSide">

            <!-- Viser trainerens Pokemon -->
            <section id="trainerPokemonSection">

                <h2 id="selectedTrainerName">
                    Vælg en trainer
                </h2>

                <p id="pokemonCount"></p>

                <ul id="whichTrainersOwnWhatPokemon"></ul>

                <div id="trainerPokemon"></div>

            </section>

            <!-- Tilføj Pokemon til trainer -->
            <section id="addPokemonSection">

                <h2>Tilføj en Pokemon</h2>

                <form id="addPokemonForm">

                    <!-- Vælg trainer -->
                    <select
                            id="trainer_id"
                            name="trainer_id"
                            required
                    >
                        <option value="">
                            Vælg en trainer
                        </option>
                    </select>

                    <!-- Vælg Pokemon -->
                    <select
                            id="pokedex_number"
                            name="pokedex_number"
                            required
                    >
                        <option value="">
                            Vælg en Pokemon
                        </option>
                    </select>

                    <button type="submit" id="addPokemonBtn">
                        Tilføj Pokemon
                    </button>

                </form>

            </section>

        </div>

    </div>

</main>

<script src="trainer.js" defer></script>
</body>
</html>
