<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokedex</title>
    <link rel="stylesheet" href="pokemon.css">
</head>

<body>

<header>
    <nav>
        <h1>Pokédex</h1>
        <a href="forside.html">Forside</a>
        <a href="pokemon.html">Pokémon</a>
        <a href="trainer.html">Trainers</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>
    <section>
        <h2>Der er så mange pokemons i denne verden. Her kan du se dem ALLE </h2>
        <button id = "showAllPokemonButton" >Hvis dem ALLE</button>
        <button id="clearAllPokemon">Clear</button>
        <ul id= "showAllPokemonList">  </ul>
        <div id="allPokemonResult"></div>
    </section>

    <section id="nameStats">
        <h2>Søg efter en pokemon og se dens stats</h2>
        <input id="pokemonName" type="text" placeholder="Fx Ivysaur">
        <button id="searchPokemonStats">Søg</button>
        <button id="clearPokemonNameStats">Clear</button>
        <div id="nameResult"></div>
    </section>

    <section id="primaryTypeStats">
        <h2>Vil du søge efter deres primary type? Så kan du gøre det her</h2>
        <input id="pokemonType" type="text" placeholder="Fx Fire">
        <button id="SearchType">Søg</button>
        <button id="clearType">Clear</button>
        <div id="typeResult"></div>
    </section>

    <section id="attackStats">
        <h2>Vil du søge efter hvor voldsomme de er? Find deres attack her </h2>
        <input id="pokemonAttack" type="number" placeholder="Fx 100">
        <button id="SearchAttack">Søg</button>
        <button id="clearPokemonStats">Clear</button>
        <div id="attackResult"></div>
    </section>
</main>
<script src="pokemon.js"></script>
</body>
</html>
